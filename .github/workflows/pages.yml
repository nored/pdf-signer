name: Deploy Pages with version stamp

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Stamp version into web/index.html
        run: |
          SHA=$(git rev-parse HEAD)
          BUILT=$(date -u '+%Y-%m-%d %H:%M UTC')
          # Rewrite the placeholders in-place.
          sed -i "s|__COMMIT_SHA__|${SHA}|g; s|__BUILD_TIME__|${BUILT}|g" web/index.html
          echo "Stamped SHA=${SHA} BUILT=${BUILT}"

      - uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
