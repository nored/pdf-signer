[package]
name = "pdf-signer"
version = "0.1.0"
edition = "2021"
description = "Click-to-place digital PDF signer."
authors = ["schwarz553@googlemail.com"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
panic = "abort"
